# $schema: https://json-schema.org/draft/2020-12/schema
title: Text Integrity Checks extension
description: Configuration for the checks-text-integrity extension (app.extensions.checks-text-integrity)
type: object
additionalProperties: false
properties:
  task:
    type: boolean
    description: This extension registers dashboard / task integration
  checks:
    type: boolean
    description: This extension registers check services on works
  routes:
    type: boolean
    description: This extension registers HTTP routes
  serviceName:
    type: string
    description: >-
      Checks-relay plugin name for text integrity checks. Used in paths under /api/v1/services/{serviceName}/instances/{instanceId}/ (upload, configure, status, check routes). When omitted, runtime defaults to echo.
  relayInstanceId:
    type: string
    description: >-
      checks-relay instance id (URL segment). Object-store overrides take precedence over this value when set in admin; otherwise defaults to the literal id "default".
  notifyBaseUrl:
    type: string
    description: >-
      Required absolute base for Text Integrity webhook notify URLs (no trailing slash), e.g. https://host/v1/hooks/text-integrity/notify. Provider API keys belong in object store only, not here.
  eulaCronSecret:
    type: string
    secret: true
    description: >-
      Bearer token for cron POST/GET /v1/hooks/text-integrity/eula-cache/refresh (refreshes cached Turnitin EULA via checks-relay getTerms). May also be set as app.checks.eulaCronSecret.
  autoRetry:
    type: object
    description: >-
      Automated retry policy for failed check runs (invoked by CronJob text-integrity-retry-sweep).
      Sweep schedule is configured on that CronJob in System → Cron, not here.
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: When false, the sweep handler no-ops and cron seed registers the job disabled.
      backoff:
        type: object
        additionalProperties: false
        properties:
          fixedIntervalMs:
            type: integer
            description: Phase 1 — wait after failure before each auto-retry (e.g. 600000 = 10 min).
          fixedRetryCount:
            type: integer
            description: Number of auto-retries at fixedIntervalMs before exponential backoff.
          stepBaseDelayMs:
            type: integer
            description: Phase 2 — base delay after fixed phase (e.g. 3600000 = 1 hour).
          multiplier:
            type: integer
            description: Exponential multiplier for phase 2 delays.
          maxStepDelayMs:
            type: integer
            description: Cap on each phase 2 retry interval (e.g. 43200000 = 12 hours).
      limits:
        type: object
        additionalProperties: false
        properties:
          maxRetryWindowMs:
            type: integer
            description: Stop auto-retry after this duration from the root failure (e.g. 259200000 = 3 days).
          maxAttempts:
            type: integer
            description: Hard cap on attempt number for auto-retry eligibility.
      sweep:
        type: object
        additionalProperties: false
        properties:
          limit:
            type: integer
            description: Maximum failed runs processed per sweep invocation.
