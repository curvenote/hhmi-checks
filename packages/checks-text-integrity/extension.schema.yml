# $schema: https://json-schema.org/draft/2020-12/schema
title: Text Integrity Checks extension
description: Configuration for the checks-text-integrity extension (app.extensions.checks-text-integrity)
type: object
additionalProperties: true
properties:
  task:
    type: boolean
    description: This extension registers dashboard / task integration
  checks:
    type: boolean
    description: This extension registers check services on works
  routes:
    type: boolean
    description: This extension registers HTTP routes
  apiBaseUrl:
    type: string
    description: Default external text integrity API base URL (may be overridden in admin / Object store)
  keyName:
    type: string
    description: >-
      Non-secret identifier for the signing key (e.g. CDN private bucket key name). May be overridden via admin / Object store.
  serviceName:
    type: string
    description: >-
      Checks-relay plugin name for text integrity checks. Used for relay API paths under /api/v1/services/{serviceName}/ (e.g. configure, status, submit).
